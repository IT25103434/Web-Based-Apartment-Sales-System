# Application Name & Active Profile
spring.application.name=Apartment-Sales-Listing-Module
spring.profiles.active=mssql

# Temporary Development Current Agent Configuration (to be replaced by SecurityContext when auth is added)
app.current.agent.email=john.alex@apexrealty.com

# Server Port
server.port=8080

# Microsoft SQL Server Database Configuration
spring.datasource.url=jdbc:sqlserver://localhost:12972;databaseName=ApartmentSalesDB;encrypt=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=123

# JPA / Hibernate Configuration (MSSQL - preserve existing schema without modification)
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2016Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# Media Storage Configuration
app.upload.dir=uploads

