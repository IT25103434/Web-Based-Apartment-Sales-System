# ============================================
# Apartment Sales System - Backend Config
# ============================================

spring.application.name=apartment-backend
server.port=8080

# ---------- Database (Microsoft SQL Server) ----------
# Update the server name / database name / credentials to match your SSMS setup.
# Database itself + tables are created by the SQL scripts in the "database" folder.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ApartmentSalesDB;integratedSecurity=true;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# JPA / Hibernate
# ddl-auto=update lets Hibernate create/update tables automatically from the entities,
# which is convenient while developing. If you run the SQL scripts from the "database"
# folder yourself, you can switch this to "validate" or "none" instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# Kept "true" (the Spring Boot default) so related entities (e.g. a booking's
# listing/buyer/agent) can still be read while the response is being built,
# without needing to convert every single entity into its own DTO class.
spring.jpa.open-in-view=true

# ---------- File uploads (listing photos, inspection photos, PDFs) ----------
# Files are saved on the server's local disk under this folder and served back
# at /uploads/** . For a real production app you'd use cloud storage instead,
# but local disk storage is simpler and enough for a university project.
app.upload.dir=uploads
app.upload.max-file-size=15MB
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=30MB

# ---------- JWT ----------
# IMPORTANT: change this secret before deploying anywhere public.
app.jwt.secret=ChangeThisSecretKeyToSomethingLongAndRandomForYourProjectSubmission123456
app.jwt.expiration-ms=86400000

# ---------- Email (real SMTP sending via JavaMailSender) ----------
# Example uses Gmail SMTP. To use Gmail:
#  1. Turn on 2-Step Verification on the Gmail account.
#  2. Create an "App Password" (Google Account -> Security -> App Passwords).
#  3. Put that 16-character app password below (NOT your normal Gmail password).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-16-char-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=your-email@gmail.com
app.mail.enabled=true

# ---------- Frontend URL (used in password reset email links, CORS) ----------
app.frontend.url=http://localhost:5173

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
logging.level.com.apartment.backend=DEBUG
